# Blueprint do Render para a demonstração hospedada (docs/hospedagem.md).
services:
  - type: web
    name: linha-viva
    runtime: docker
    dockerfilePath: ./Dockerfile.demo
    plan: free
    # região mais próxima do Brasil entre as disponíveis
    region: virginia
    branch: main
    autoDeploy: true
    healthCheckPath: /
    envVars:
      # contas de professor no Supabase; valores definidos no painel, nunca no repositório
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      # opcional: com um código, só quem o souber cria conta de professor;
      # em branco, qualquer pessoa com o link cria
      - key: CONVITE_PROFESSOR
        sync: false
      # assina os logins; gerado pelo Render e mantido entre publicações
      - key: SESSAO_SEGREDO
        generateValue: true
      - key: LINHA_VIVA_TEMA
        value: ciclo-da-agua
